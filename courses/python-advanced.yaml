git:
  delivery: git
  provider: forgejo
  student_repo_modes:
  - managed
  - download
name: Data Science mit Python – Vertiefung
description: Ein deutschsprachiger Vertiefungskurs mit selbstständigen mathematischen
  und naturwissenschaftlichen Problemen, Gleichungssystemen, Kurvenanalyse, Differentialgleichungen
  und objektorientierter Programmierung.
path: python.advanced
properties:
  assistant_policy:
    action_mode: ask
    completion: "off"
    independent_check: false
services:
- slug: itpcp.exec.py
content_types:
- color: green
  kind: unit
  slug: weekly
  title: Woche
- color: yellow
  kind: assignment
  slug: advanced
  title: Aufgabe
- color: orange
  kind: assignment
  slug: extra
  title: Zusatzaufgabe
