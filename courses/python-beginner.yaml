name: Data Science mit Python I – Grundlagen
title_i18n:
  de: Data Science mit Python I – Grundlagen
  en: Data Science with Python I – Fundamentals
position: 10
description: |-
  Dieser Kurs ist der Einstieg in die Datenanalyse mit Python und setzt keine Programmiererfahrung voraus. Er richtet sich an Studierende der Naturwissenschaften und an alle, die Python für Berechnungen, Messdaten und Grafiken nutzen wollen. Du rechnest mit Variablen, Vektoren und den Funktionen von NumPy, verarbeitest Zeichenketten, schreibst eigene Funktionen und stellst Ergebnisse mit matplotlib dar; in Laborübungen wertest du Messdaten aus Versuchen aus.

  Der Kurs ist in drei Wochen mit jeweils sieben Aufgaben gegliedert, und die letzte Aufgabe ist eine Wiederholung der Grundlagen. Jede Aufgabe hat eine Anleitung auf Deutsch und auf Englisch, und deine eingereichte Lösung wird automatisch getestet, sodass du sofort siehst, was schon funktioniert.

  Du brauchst ein Computor-Konto und einen Rechner mit Internetzugang. Programmieren kannst du in einem Arbeitsbereich, den Computor bereitstellt, oder lokal in VS Code mit der Computor-Erweiterung. Auf diesen Kurs bauen „Data Science mit Python II – Aufbau“ und „III – Vertiefung“ auf.
description_i18n:
  de: |-
    Dieser Kurs ist der Einstieg in die Datenanalyse mit Python und setzt keine Programmiererfahrung voraus. Er richtet sich an Studierende der Naturwissenschaften und an alle, die Python für Berechnungen, Messdaten und Grafiken nutzen wollen. Du rechnest mit Variablen, Vektoren und den Funktionen von NumPy, verarbeitest Zeichenketten, schreibst eigene Funktionen und stellst Ergebnisse mit matplotlib dar; in Laborübungen wertest du Messdaten aus Versuchen aus.

    Der Kurs ist in drei Wochen mit jeweils sieben Aufgaben gegliedert, und die letzte Aufgabe ist eine Wiederholung der Grundlagen. Jede Aufgabe hat eine Anleitung auf Deutsch und auf Englisch, und deine eingereichte Lösung wird automatisch getestet, sodass du sofort siehst, was schon funktioniert.

    Du brauchst ein Computor-Konto und einen Rechner mit Internetzugang. Programmieren kannst du in einem Arbeitsbereich, den Computor bereitstellt, oder lokal in VS Code mit der Computor-Erweiterung. Auf diesen Kurs bauen „Data Science mit Python II – Aufbau“ und „III – Vertiefung“ auf.
  en: |-
    This course is an introduction to data analysis with Python and assumes no programming experience. It is meant for science students and anyone who wants to use Python for calculations, measured data and plots. You compute with variables, vectors and NumPy functions, work with strings, write your own functions and plot results with matplotlib; in lab exercises you analyse data from lab experiments.

    The course runs over three weeks with seven assignments each, and the last assignment is a review of the fundamentals. Every assignment has instructions in German and English, and the solution you submit is tested automatically, so you see at once what already works.

    You need a Computor account and a computer with internet access. You can program in a workspace provided by Computor or locally in VS Code with the Computor extension. "Data Science with Python II – Intermediate" and "III – Advanced" build on this course.
