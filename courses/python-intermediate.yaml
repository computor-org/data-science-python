name: Data Science mit Python II – Aufbau
title_i18n:
  de: Data Science mit Python II – Aufbau
  en: Data Science with Python II – Intermediate
position: 20
description: |-
  Der Aufbaukurs setzt den Grundlagenkurs fort und führt von einzelnen Rechnungen zu eigenen kleinen Programmen. Du lernst Datentypen und die Grenzen der Rechengenauigkeit kennen, steuerst den Programmablauf mit if-Entscheidungen sowie for- und while-Schleifen und wählst Daten mit logischer Indizierung gezielt aus. Später speicherst du Daten in Dictionaries und JSON-Dateien, erstellst 3D-Plots, Animationen und Histogramme und passt mit SciPy Modelle an Messdaten an.

  Der Kurs umfasst fünf Wochen mit jeweils fünf bis sieben Aufgaben, darunter Zusatzaufgaben für alle, die mehr üben wollen, und eine Wiederholung in der vierten Woche. Jede Aufgabe hat eine Anleitung auf Deutsch und auf Englisch, und deine eingereichte Lösung wird automatisch getestet.

  Du solltest mit dem Stoff von „Data Science mit Python I – Grundlagen“ vertraut sein, also mit Variablen, NumPy-Vektoren, Funktionen und einfachen Plots. Du brauchst ein Computor-Konto und arbeitest wie dort in einem Arbeitsbereich von Computor oder lokal in VS Code mit der Computor-Erweiterung.
description_i18n:
  de: |-
    Der Aufbaukurs setzt den Grundlagenkurs fort und führt von einzelnen Rechnungen zu eigenen kleinen Programmen. Du lernst Datentypen und die Grenzen der Rechengenauigkeit kennen, steuerst den Programmablauf mit if-Entscheidungen sowie for- und while-Schleifen und wählst Daten mit logischer Indizierung gezielt aus. Später speicherst du Daten in Dictionaries und JSON-Dateien, erstellst 3D-Plots, Animationen und Histogramme und passt mit SciPy Modelle an Messdaten an.

    Der Kurs umfasst fünf Wochen mit jeweils fünf bis sieben Aufgaben, darunter Zusatzaufgaben für alle, die mehr üben wollen, und eine Wiederholung in der vierten Woche. Jede Aufgabe hat eine Anleitung auf Deutsch und auf Englisch, und deine eingereichte Lösung wird automatisch getestet.

    Du solltest mit dem Stoff von „Data Science mit Python I – Grundlagen“ vertraut sein, also mit Variablen, NumPy-Vektoren, Funktionen und einfachen Plots. Du brauchst ein Computor-Konto und arbeitest wie dort in einem Arbeitsbereich von Computor oder lokal in VS Code mit der Computor-Erweiterung.
  en: |-
    The intermediate course continues the fundamentals course and takes you from single calculations to small programs of your own. You learn about data types and the limits of numerical precision, control the flow of a program with if statements and for and while loops, and select data with logical indexing. Later you store data in dictionaries and JSON files, create 3D plots, animations and histograms, and fit models to measured data with SciPy.

    The course runs over five weeks with five to seven assignments each, including extra assignments for anyone who wants more practice and a review in the fourth week. Every assignment has instructions in German and English, and the solution you submit is tested automatically.

    You should be familiar with the material of "Data Science with Python I – Fundamentals", that is variables, NumPy vectors, functions and simple plots. You need a Computor account and, as before, work in a workspace provided by Computor or locally in VS Code with the Computor extension.
language_code: de
path: python.intermediate
