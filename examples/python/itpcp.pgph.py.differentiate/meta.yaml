  en: 'Curve Analysis: Analytical and Numerical Solution'
description: In dieser Kurvendiskussion untersuchst du eine Funktion analytisch mit
  SymPy und numerisch mit NumPy. Du bestimmst Nullstellen, Extrema und Ableitungen
  und stellst die Ergebnisse grafisch dar.
description_i18n:
  de: In dieser Kurvendiskussion untersuchst du eine Funktion analytisch mit SymPy
    und numerisch mit NumPy. Du bestimmst Nullstellen, Extrema und Ableitungen und
    stellst die Ergebnisse grafisch dar.
  en: In this exercise you will perform a curve analysis by solving a function both
    analytically with SymPy and numerically with NumPy. You will determine zeros,
    extrema and derivatives and visualize the results.
