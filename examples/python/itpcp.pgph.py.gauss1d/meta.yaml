description: Du implementierst die Gauß- oder Normalverteilung. Deine Funktion berechnet
  die Summe mehrerer Gaußfunktionen mit unterschiedlichen Parametern, deren Ergebnis
  du anschließend grafisch darstellst.
description_i18n:
  de: Du implementierst die Gauß- oder Normalverteilung. Deine Funktion berechnet
