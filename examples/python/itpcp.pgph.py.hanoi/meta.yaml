title: Türme von Hanoi
title_i18n:
  de: Türme von Hanoi
  en: Towers of Hanoi
description: Du programmierst eine rekursive Lösung für das klassische Problem der
  Türme von Hanoi. Dabei lernst du das Prinzip der Rekursion kennen, bei der eine
  Funktion sich selbst aufruft, bis eine Abbruchbedingung erreicht ist.
description_i18n:
  de: Du programmierst eine rekursive Lösung für das klassische Problem der Türme
    von Hanoi. Dabei lernst du das Prinzip der Rekursion kennen, bei der eine Funktion
    sich selbst aufruft, bis eine Abbruchbedingung erreicht ist.
  en: In this exercise you will program a recursive solution for the classic problem
    of the Towers of Hanoi. You will learn the concept of recursion, where a function
    calls itself until a termination condition is reached.
