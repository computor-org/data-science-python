description: Du bestimmst die Parameter eines Kegelschnitts, indem du ein lineares
  Gleichungssystem löst. Dabei lernst du die mathematische Beschreibung von Ellipsen,
  Parabeln und Hyperbeln kennen und stellst das Ergebnis als 3D-Plot mit Höhenlinien
  dar.
description_i18n:
  de: Du bestimmst die Parameter eines Kegelschnitts, indem du ein lineares Gleichungssystem
    löst. Dabei lernst du die mathematische Beschreibung von Ellipsen, Parabeln und
    Hyperbeln kennen und stellst das Ergebnis als 3D-Plot mit Höhenlinien dar.
  en: In this exercise you will determine the parameters of a conic section by solving
    a linear system of equations. You will learn the mathematical description of ellipses,
    parabolas and hyperbolas and display the result as a 3D plot with contour lines.
