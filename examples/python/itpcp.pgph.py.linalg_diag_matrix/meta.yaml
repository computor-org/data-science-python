description: Du löst ein lineares Gleichungssystem mit einer Tridiagonalmatrix. Du
  erzeugst die Matrix mit eye und diag, löst das System und machst unter Berücksichtigung
  von Rundungsfehlern eine numerische Probe.
description_i18n:
  de: Du löst ein lineares Gleichungssystem mit einer Tridiagonalmatrix. Du erzeugst
    die Matrix mit eye und diag, löst das System und machst unter Berücksichtigung
    von Rundungsfehlern eine numerische Probe.
  en: In this exercise you will solve a linear system of equations with a tridiagonal
    matrix. You will create the matrix with eye and diag, solve the system and perform
    a numerical verification, taking rounding errors into account.
