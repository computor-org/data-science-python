slug: itpcp.pgph.py.pendulum_animation
version: 1.0.0
title: Animation of a Pendulum
description: In this exercise a pendulum is animated and displayed in phase space.
  The symplectic Euler method is adapted to restrict the angle to the range from -pi
  to pi. Additionally, contours of constant total energy are displayed with matplotlib.
