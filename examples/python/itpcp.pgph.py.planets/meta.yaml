version: 1.0.3
title: Objektorientierte Programmierung in Python
title_i18n:
  de: Objektorientierte Programmierung in Python
  en: Object-Oriented Programming in Python
description: Diese Aufgabe führt in die objektorientierte Programmierung mit Python
  ein. Du schreibst eine Klasse Planet, die Eigenschaften wie Masse, Durchmesser und
  Umlaufzeit speichert, berechnest die Dichte der Planeten und setzt dieselbe Funktionalität
  zum Vergleich mit Dictionaries um.
description_i18n:
  de: Diese Aufgabe führt in die objektorientierte Programmierung mit Python ein.
    Du schreibst eine Klasse Planet, die Eigenschaften wie Masse, Durchmesser und
    Umlaufzeit speichert, berechnest die Dichte der Planeten und setzt dieselbe Funktionalität
    zum Vergleich mit Dictionaries um.
  en: This exercise introduces object-oriented programming with Python. A Planet class
    is created that stores properties such as mass, diameter and orbital period. The
    density of the planets is calculated and the same functionality is also implemented
    with dictionaries.
