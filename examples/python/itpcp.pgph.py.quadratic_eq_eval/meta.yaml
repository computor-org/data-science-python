title: Berechnung der linken Seite einer quadratischen Gleichung
title_i18n:
  de: Berechnung der linken Seite einer quadratischen Gleichung
  en: Calculation of the Left Side of a Quadratic Equation
description: Du schreibst eine Funktion, die die linke Seite einer quadratischen Gleichung
  für gegebene Lösungen auswertet. Damit prüfst du, wie genau berechnete Lösungen
  numerisch sind; die Funktion verarbeitet Arrays von Koeffizienten und Lösungen.
description_i18n:
  de: Du schreibst eine Funktion, die die linke Seite einer quadratischen Gleichung
    für gegebene Lösungen auswertet. Damit prüfst du, wie genau berechnete Lösungen
    numerisch sind; die Funktion verarbeitet Arrays von Koeffizienten und Lösungen.
  en: In this exercise a function is written that evaluates the left side of a quadratic
    equation for given solutions. This serves to verify the numerical accuracy of
    calculated solutions. The function processes arrays of coefficients and solutions.
