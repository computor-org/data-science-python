slug: itpcp.pgph.py.radioactive_decay
version: 1.0.3
title: Fitten von radioaktiven Zerfällen
title_i18n:
  de: Fitten von radioaktiven Zerfällen
  en: Fitting Radioactive Decays
description: Du modellierst den radioaktiven Zerfall in einer Zerfallskette und passt
  das Modell an Messdaten an. Die Zerfallskonstanten bestimmst du mit scipy.optimize.curve_fit,
  das Maximum der Isotopenkonzentration mit scipy.optimize.fmin, und du stellst die
  Ergebnisse grafisch dar.
description_i18n:
  de: Du modellierst den radioaktiven Zerfall in einer Zerfallskette und passt das
    Modell an Messdaten an. Die Zerfallskonstanten bestimmst du mit scipy.optimize.curve_fit,
    das Maximum der Isotopenkonzentration mit scipy.optimize.fmin, und du stellst
    die Ergebnisse grafisch dar.
  en: In this exercise radioactive decay in a decay chain is modeled and fitted to
    measurement data. The decay constants are determined with scipy.optimize.curve_fit.
    The maximum of the isotope concentration is calculated with scipy.optimize.fmin
    and displayed graphically.
