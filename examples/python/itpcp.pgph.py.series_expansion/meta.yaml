slug: itpcp.pgph.py.series_expansion
version: 1.0.0
title: Sine Series Expansion
description: This exercise implements the Taylor series of the sine function without
  loops using NumPy matrix operations. With np.meshgrid all series terms are calculated
  simultaneously. The partial sums are compared with the analytical solution and displayed
  graphically.
