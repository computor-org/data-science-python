title: Erzeugung von Vektoren
title_i18n:
  de: Erzeugung von Vektoren
  en: Creating Vectors
description: 'Du lernst verschiedene Wege kennen, NumPy-Vektoren zu erzeugen: mit
  linearen und logarithmischen Abständen sowie als berechnete Folgen wie Zweierpotenzen
  und Dreieckszahlen. Dabei verwendest du arange, linspace, logspace und cumsum.'
description_i18n:
  de: 'Du lernst verschiedene Wege kennen, NumPy-Vektoren zu erzeugen: mit linearen
    und logarithmischen Abständen sowie als berechnete Folgen wie Zweierpotenzen und
    Dreieckszahlen. Dabei verwendest du arange, linspace, logspace und cumsum.'
  en: This exercise covers various methods for creating NumPy vectors. Linear and
    logarithmic spacings, as well as calculated sequences like powers of two and triangular
    numbers are created. The commands arange, linspace, logspace and cumsum are used.
