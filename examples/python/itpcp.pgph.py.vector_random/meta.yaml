version: 1.0.2
title: Erzeugen von Zufallszahlen
title_i18n:
  de: Erzeugen von Zufallszahlen
  en: Generating Random Numbers
description: Diese Aufgabe führt in das Erzeugen von Zufallszahlen mit NumPy ein.
  Du erzeugst gleichverteilte, normalverteilte und ganzzahlige Zufallszahlen in verschiedenen
  Intervallen und nutzt dabei die Dokumentation von numpy.random.
description_i18n:
  de: Diese Aufgabe führt in das Erzeugen von Zufallszahlen mit NumPy ein. Du erzeugst
    gleichverteilte, normalverteilte und ganzzahlige Zufallszahlen in verschiedenen
    Intervallen und nutzt dabei die Dokumentation von numpy.random.
  en: This exercise introduces the generation of random numbers with NumPy. Uniformly
    distributed and normally distributed random numbers as well as integer random
    numbers in various intervals are generated. The numpy.random documentation is
    used as a reference.
