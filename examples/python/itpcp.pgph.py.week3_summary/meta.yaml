title_i18n:
  de: Beta-Absorption
  en: Beta Absorption
description: Diese Aufgabe fasst die ersten drei Wochen zusammen. Du untersuchst die
  Betaabsorption und den radioaktiven Zerfall (Sr-90/Y-90) mit dem Lambert-Beerschen
  Gesetz, liest Daten ein, verarbeitest sie, stellst sie logarithmisch dar und bestimmst
  mit linearen Fits die Massenabsorptionskoeffizienten.
description_i18n:
  de: Diese Aufgabe fasst die ersten drei Wochen zusammen. Du untersuchst die Betaabsorption
    und den radioaktiven Zerfall (Sr-90/Y-90) mit dem Lambert-Beerschen Gesetz, liest
    Daten ein, verarbeitest sie, stellst sie logarithmisch dar und bestimmst mit linearen
    Fits die Massenabsorptionskoeffizienten.
  en: This example is a summary of the first three weeks of the course. It covers
    the analysis of beta absorption and radioactive decay (Sr-90/Y-90) using the Beer-Lambert
    law. You will learn to read data, process it, display it logarithmically, and
    perform linear fits to determine mass absorption coefficients.
